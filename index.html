<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Pembayaran Kas Kelas</title>

    <!-- Bootstrap CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            background: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        .payment-card {
            max-width: 430px;
            margin: 50px auto;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.10);
        }

        .header {
            background: #00a86b;
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header h2 {
            font-weight: bold;
        }

        .gopay-box {
            background: #f1fff9;
            border: 1px solid #bcebd8;
            border-radius: 15px;
            padding: 20px;
        }

        .nomor {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .btn-gopay {
            background: #00a86b;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 13px;
            font-size: 17px;
            font-weight: bold;
        }

        .btn-gopay:hover {
            background: #008f5a;
            color: white;
        }

        .info {
            font-size: 14px;
            color: #666;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card payment-card">

        <!-- HEADER -->
        <div class="header">
            <h2>💰 Kas Kelas</h2>
            <p class="mb-0">
                Komputerisasi Akuntansi
            </p>
        </div>

        <!-- ISI -->
        <div class="card-body p-4">

            <h5 class="text-center mb-4">
                Pembayaran Kas Kelas
            </h5>

            <div class="gopay-box text-center mb-4">

                <div class="mb-2">
                    Bayar melalui GoPay
                </div>

                <div class="nomor">
                    0896 5528 6269
                </div>

                <button
                    class="btn btn-outline-success mt-3"
                    onclick="copyNomor()">
                    📋 Salin Nomor
                </button>

            </div>

            <!-- JUMLAH KAS -->
            <div class="mb-3">
                <label class="form-label">
                    Jumlah Kas
                </label>

                <select class="form-select">
                    <option>Rp5.000</option>
                    <option>Rp10.000</option>
                    <option>Rp20.000</option>
                    <option>Nominal Lainnya</option>
                </select>
            </div>

            <!-- NAMA -->
            <div class="mb-3">
                <label class="form-label">
                    Nama Mahasiswa
                </label>

                <input
                    type="text"
                    class="form-control"
                    placeholder="Masukkan nama">
            </div>

            <!-- TOMBOL GOPAY -->
            <a
                href="https://gopay.co.id/"
                target="_blank"
                class="btn btn-gopay w-100">

                💚 Bayar dengan GoPay

            </a>

            <p class="info text-center mt-3 mb-0">
                Setelah melakukan pembayaran,
                simpan bukti transaksi dan kirimkan
                kepada bendahara kelas.
            </p>

        </div>

    </div>

</div>


<script>

function copyNomor() {

    const nomor = "089655286269";

    navigator.clipboard.writeText(nomor)
        .then(function() {

            alert("Nomor GoPay berhasil disalin!");

        })
        .catch(function() {

            alert("Nomor GoPay: " + nomor);

        });

}

</script>

</body>
</html>
