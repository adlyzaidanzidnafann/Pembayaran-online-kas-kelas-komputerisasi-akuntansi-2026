<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kas Kelas Komputerisasi Akuntansi</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f7f5;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,.1);
        }

        h1 {
            margin-bottom: 8px;
        }

        .nomor {
            background: #f1f1f1;
            padding: 12px;
            border-radius: 10px;
            margin: 20px 0;
            font-weight: bold;
        }

        .btn-dana {
            display: block;
            padding: 16px;
            background: #118ee9;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
        }

        .btn-dana:active {
            transform: scale(.97);
        }

        .info {
            margin-top: 15px;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>💙 Kas Kelas</h1>

    <p>Komputerisasi Akuntansi</p>

    <div class="nomor">
        DANA: 085692962385
    </div>

    <!-- GANTI DENGAN LINK PEMBAYARAN DANA -->
    <a
        href="LINK_PAYMENT_DANA"
        class="btn-dana"
    >
        💙 BAYAR DENGAN DANA
    </a>

    <div class="info">
        Klik tombol untuk melanjutkan pembayaran.
    </div>

</div>

</body>
</html>
