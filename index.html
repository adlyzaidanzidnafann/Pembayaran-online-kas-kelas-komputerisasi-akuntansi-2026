<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Kas Kelas Komputerisasi Akuntansi</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f7f5;
            color: #222;
        }

        .wrapper {
            width: 100%;
            max-width: 430px;
            margin: 30px auto;
            padding: 15px;
        }

        .card {
            background: #ffffff;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }

        .header {
            background: #00a86b;
            color: white;
            text-align: center;
            padding: 32px 20px;
        }

        .header .icon {
            font-size: 45px;
        }

        .header h1 {
            margin: 8px 0;
            font-size: 27px;
        }

        .header p {
            margin: 0;
            font-size: 15px;
        }

        .content {
            padding: 25px;
        }

        .title {
            text-align: center;
            margin-bottom: 25px;
        }

        .title h2 {
            margin: 0 0 5px;
            font-size: 21px;
        }

        .title p {
            margin: 0;
            color: #777;
            font-size: 14px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            height: 50px;
            padding: 0 14px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            margin-bottom: 20px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #00a86b;
        }

        .gopay-box {
            background: #effff8;
            border: 1px solid #bcebd8;
            border-radius: 18px;
            padding: 20px;
            text-align: center;
            margin-bottom: 22px;
        }

        .gopay-title {
            font-size: 15px;
            margin-bottom: 8px;
        }

        .gopay-number {
            color: #00a86b;
            font-size: 23px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .copy-button {
            margin-top: 13px;
            padding: 10px 16px;
            background: white;
            color: #00a86b;
            border: 1px solid #00a86b;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        /*
        ========================================
        TOMBOL PEMBAYARAN
        ========================================
        */

        .pay-button {
            display: block;
            width: 100%;
            padding: 17px;
            background: #00a86b;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: bold;
            border: none;
        }

        .pay-button:active {
            transform: scale(0.98);
        }

        .note {
            text-align: center;
            color: #777;
            font-size: 13px;
            line-height: 1.5;
            margin-top: 18px;
        }

        .footer {
            text-align: center;
            font-size: 12px;
            color: #999;
            margin-top: 20px;
        }
    </style>
</head>


<body>

<div class="wrapper">

    <div class="card">

        <!-- HEADER -->
        <div class="header">

            <div class="icon">
                💰
            </div>

            <h1>
                KAS KELAS
            </h1>

            <p>
                Komputerisasi Akuntansi
            </p>

        </div>


        <!-- CONTENT -->
        <div class="content">

            <div class="title">

                <h2>
                    Pembayaran Kas Online
                </h2>

                <p>
                    Silakan lakukan pembayaran melalui GoPay
                </p>

            </div>


            <!-- NAMA -->
            <label>
                Nama Mahasiswa
            </label>

            <input
                type="text"
                id="nama"
                placeholder="Masukkan nama mahasiswa">


            <!-- NOMINAL -->
            <label>
                Nominal Kas
            </label>

            <select id="nominal">

                <option value="5000">
                    Rp5.000
                </option>

                <option value="10000">
                    Rp10.000
                </option>

                <option value="20000">
                    Rp20.000
                </option>

                <option value="25000">
                    Rp25.000
                </option>

            </select>


            <!-- GOPAY -->
            <div class="gopay-box">

                <div class="gopay-title">
                    💚 Nomor GoPay Bendahara
                </div>

                <div class="gopay-number">
                    0896 5528 6269
                </div>

                <button
                    type="button"
                    class="copy-button"
                    onclick="salinNomor()">

                    📋 Salin Nomor

                </button>

            </div>


            <!--
            ==================================================
            PAYMENT LINK GOPAY
            ==================================================

            GANTI URL DI BAWAH DENGAN PAYMENT LINK RESMI
            YANG DIBUAT DARI GOPAY MERCHANT.

            Contoh format:
            https://info.gopay.co.id/a/xxxxx

            ==================================================
            -->

            <a
                href="MASUKKAN_PAYMENT_LINK_GOPAY_DI_SINI"
                class="pay-button">

                💚 BAYAR SEKARANG

            </a>


            <div class="note">

                Setelah menekan tombol,
                kamu akan diarahkan ke proses pembayaran GoPay.

            </div>

        </div>

    </div>


    <div class="footer">

        Kas Kelas • Komputerisasi Akuntansi

    </div>

</div>


<script>

function salinNomor() {

    const nomor = "089655286269";

    navigator.clipboard.writeText(nomor)
        .then(function () {

            const tombol =
                document.querySelector(".copy-button");

            tombol.innerHTML =
                "✓ Nomor Berhasil Disalin";

            setTimeout(function () {

                tombol.innerHTML =
                    "📋 Salin Nomor";

            }, 2000);

        })
        .catch(function () {

            alert("Nomor GoPay: " + nomor);

        });

}

</script>

</body>

</html>
