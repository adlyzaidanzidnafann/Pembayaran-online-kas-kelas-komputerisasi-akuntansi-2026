<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kas Kelas Komputerisasi Akuntansi</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 30px 22px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.10);
        }

        h1 {
            margin-bottom: 8px;
            font-size: 24px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
        }

        .nomor {
            background: #f1f1f1;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .bayar {
            display: block;
            width: 100%;
            padding: 15px;
            background: #00a86b;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            transition: 0.2s;
        }

        .bayar:active {
            transform: scale(0.97);
        }

        .info {
            margin-top: 18px;
            font-size: 13px;
            color: #888;
            line-height: 1.5;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>💚 Kas Kelas</h1>

    <div class="subtitle">
        Komputerisasi Akuntansi
    </div>

    <div class="nomor">
        GoPay: 089655286269
    </div>

    <!-- GANTI LINK DI BAWAH DENGAN PAYMENT LINK GOPAY RESMI -->
    <a
        class="bayar"
        href="LINK_GO_PAY"
    >
        💳 BAYAR SEKARANG
    </a>

    <div class="info">
        Setelah menekan tombol, kamu akan diarahkan ke pembayaran GoPay.
    </div>

</div>

</body>
</html>
