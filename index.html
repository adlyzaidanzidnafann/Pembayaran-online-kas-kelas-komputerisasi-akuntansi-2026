<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Pembayaran Kas Kelas</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f3f7f5;
        }

        .container {
            max-width: 430px;
            margin: 30px auto;
        }

        .card {
            background: white;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,.12);
        }

        .header {
            background: #00a86b;
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 27px;
        }

        .header p {
            margin: 0;
            font-size: 16px;
        }

        .content {
            padding: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
        }

        .gopay-box {
            background: #effff8;
            border: 1px solid #bcebd8;
            border-radius: 18px;
            padding: 20px;
            text-align: center;
            margin-bottom: 22px;
        }

        .gopay-number {
            color: #00a86b;
            font-size: 23px;
            font-weight: bold;
            margin-top: 8px;
        }

        .copy {
            margin-top: 12px;
            padding: 10px 15px;
            border: 1px solid #00a86b;
            background: white;
            color: #00a86b;
            border-radius: 10px;
            font-weight: bold;
        }

        .pay-button {
            display: block;
            width: 100%;
            padding: 17px;
            border-radius: 14px;
            background: #00a86b;
            color: white;
            text-align: center;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
        }

        .pay-button:active {
            transform: scale(.98);
        }

        .info {
            text-align: center;
            color: #777;
            font-size: 13px;
            line-height: 1.5;
            margin-top: 18px;
        }

    </style>
</head>


<body>

<div class="container">

    <div class="card">

        <div class="header">

            <h1>💰 KAS KELAS</h1>

            <p>
                Komputerisasi Akuntansi
            </p>

        </div>


        <div class="content">

            <label>
                Nama Mahasiswa
            </label>

            <input
                type="text"
                id="nama"
                placeholder="Masukkan nama">


            <label>
                Nominal Kas
            </label>

            <select id="nominal">

                <option value="5000">
                    Rp5.000
                </option>

                <option value="10000">
                    Rp10.000
                </option>

                <option value="20000">
                    Rp20.000
                </option>

            </select>


            <div class="gopay-box">

                <div>
                    💚 Pembayaran melalui GoPay
                </div>

                <div class="gopay-number">
                    0896 5528 6269
                </div>

                <button
                    class="copy"
                    onclick="copyNumber()">

                    📋 Salin Nomor

                </button>

            </div>


            <!--
            GANTI LINK DI BAWAH INI
            DENGAN PAYMENT LINK GOPAY RESMI
            -->

            <a
                id="bayar"
                href="MASUKKAN_LINK_GOPAY_DI_SINI"
                class="pay-button">

                💚 BAYAR SEKARANG

            </a>


            <div class="info">

                Setelah klik BAYAR SEKARANG,
                kamu akan diarahkan ke pembayaran GoPay.

            </div>

        </div>

    </div>

</div>


<script>

function copyNumber() {

    navigator.clipboard.writeText(
        "089655286269"
    );

    alert(
        "Nomor GoPay berhasil disalin!"
    );

}

</script>

</body>

</html>
